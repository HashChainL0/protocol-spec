<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="t d">
  <title id="t">Hash Chain, the privacy Layer 0</title>
  <desc id="d">A layered diagram. At the base, a validator network secured by staked ETH gives fast deterministic finality. Above it, a private-by-default layer made of shielded accounts, account chains and zero-knowledge proofs, where validators verify proofs and never see amounts or parties. On top, five pillars: Payments, Swaps, Assets, Apps and Proofs. On the left, connections to Ethereum, Base and Robinhood Chain, verified by the validator set. On the right, a connection to Monero through atomic swaps. Design draft, spec stage.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="700" rx="20" fill="#f4f5f7" stroke="#d6d9e0"/>
  <g font-family="'Bricolage Grotesque', Inter, system-ui, sans-serif" fill="#11131a">
    <text x="600" y="48" text-anchor="middle" font-size="26" font-weight="700">Hash Chain, the privacy Layer 0</text>
    <text x="600" y="72" text-anchor="middle" font-size="15" fill="#4a4f5c">Go in public. Come out private.</text>
    <text x="250" y="108" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#c2410c">PILLARS</text>
    <rect x="250" y="120" width="128" height="70" rx="12" fill="#ffffff" stroke="#11131a" stroke-width="1.5"/>
    <text x="314" y="162" text-anchor="middle" font-size="18" font-weight="700">Payments</text>
    <rect x="393" y="120" width="128" height="70" rx="12" fill="#ffffff" stroke="#11131a" stroke-width="1.5"/>
    <text x="457" y="162" text-anchor="middle" font-size="18" font-weight="700">Swaps</text>
    <rect x="536" y="120" width="128" height="70" rx="12" fill="#ffffff" stroke="#11131a" stroke-width="1.5"/>
    <text x="600" y="162" text-anchor="middle" font-size="18" font-weight="700">Assets</text>
    <rect x="679" y="120" width="128" height="70" rx="12" fill="#ffffff" stroke="#11131a" stroke-width="1.5"/>
    <text x="743" y="162" text-anchor="middle" font-size="18" font-weight="700">Apps</text>
    <rect x="822" y="120" width="128" height="70" rx="12" fill="#ffffff" stroke="#11131a" stroke-width="1.5"/>
    <text x="886" y="162" text-anchor="middle" font-size="18" font-weight="700">Proofs</text>
    <rect x="250" y="212" width="700" height="190" rx="16" fill="#2c2c2d"/>
    <text x="276" y="242" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#ff6a13">PRIVATE BY DEFAULT</text>
    <rect x="276" y="256" width="204" height="78" rx="12" fill="#11131a" stroke="#ff6a13" stroke-width="1.5"/>
    <text x="378" y="289" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Shielded accounts</text>
    <text x="378" y="313" text-anchor="middle" font-size="13" fill="#d6d9e0">balances and history hidden</text>
    <rect x="496" y="256" width="204" height="78" rx="12" fill="#11131a" stroke="#ff6a13" stroke-width="1.5"/>
    <text x="598" y="289" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Account chains</text>
    <text x="598" y="313" text-anchor="middle" font-size="13" fill="#d6d9e0">parallel, encrypted updates</text>
    <rect x="716" y="256" width="204" height="78" rx="12" fill="#11131a" stroke="#ff6a13" stroke-width="1.5"/>
    <text x="818" y="289" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Zero-knowledge proofs</text>
    <text x="818" y="313" text-anchor="middle" font-size="13" fill="#d6d9e0">checked, never revealed</text>
    <text x="600" y="375" text-anchor="middle" font-size="16" fill="#ffffff">Validators verify proofs. They never see amounts or parties.</text>
    <rect x="250" y="426" width="700" height="190" rx="16" fill="#ffffff" stroke="#11131a" stroke-width="1.5"/>
    <text x="276" y="456" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#c2410c">BASE LAYER</text>
    <text x="600" y="494" text-anchor="middle" font-size="24" font-weight="700">Hash Chain, the privacy Layer 0</text>
    <text x="600" y="520" text-anchor="middle" font-size="15" fill="#4a4f5c">Validator network (staked ETH), fast deterministic finality</text>
    <line x1="290" y1="574" x2="910" y2="574" stroke="#9aa0ad" stroke-width="1.5" stroke-dasharray="5 5"/>
    <circle cx="290.0" cy="574" r="9" fill="#ff6a13" stroke="#11131a" stroke-width="1.5"/>
    <circle cx="367.5" cy="574" r="9" fill="#ff6a13" stroke="#11131a" stroke-width="1.5"/>
    <circle cx="445.0" cy="574" r="9" fill="#ff6a13" stroke="#11131a" stroke-width="1.5"/>
    <circle cx="522.5" cy="574" r="9" fill="#ff6a13" stroke="#11131a" stroke-width="1.5"/>
    <circle cx="600.0" cy="574" r="9" fill="#ff6a13" stroke="#11131a" stroke-width="1.5"/>
    <circle cx="677.5" cy="574" r="9" fill="#ff6a13" stroke="#11131a" stroke-width="1.5"/>
    <circle cx="755.0" cy="574" r="9" fill="#ff6a13" stroke="#11131a" stroke-width="1.5"/>
    <circle cx="832.5" cy="574" r="9" fill="#ff6a13" stroke="#11131a" stroke-width="1.5"/>
    <circle cx="910.0" cy="574" r="9" fill="#ff6a13" stroke="#11131a" stroke-width="1.5"/>
    <text x="600" y="602" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#4a4f5c">VALIDATOR NODES</text>
    <text x="30" y="230" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#c2410c">CONNECTIONS</text>
    <text x="30" y="248" font-size="12" fill="#4a4f5c">verified by the validator set</text>
    <rect x="30" y="268" width="170" height="64" rx="12" fill="#ffffff" stroke="#11131a" stroke-width="1.5"/>
    <text x="115" y="307" text-anchor="middle" font-size="16" font-weight="700">Ethereum</text>
    <line x1="200" y1="300" x2="248" y2="300" stroke="#ff6a13" stroke-width="2.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <rect x="30" y="368" width="170" height="64" rx="12" fill="#ffffff" stroke="#11131a" stroke-width="1.5"/>
    <text x="115" y="407" text-anchor="middle" font-size="16" font-weight="700">Base</text>
    <line x1="200" y1="400" x2="248" y2="400" stroke="#ff6a13" stroke-width="2.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <rect x="30" y="468" width="170" height="64" rx="12" fill="#ffffff" stroke="#11131a" stroke-width="1.5"/>
    <text x="115" y="507" text-anchor="middle" font-size="16" font-weight="700">Robinhood Chain</text>
    <line x1="200" y1="500" x2="248" y2="500" stroke="#ff6a13" stroke-width="2.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <text x="1170" y="230" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#c2410c">CONNECTION</text>
    <text x="1170" y="248" text-anchor="end" font-size="12" fill="#4a4f5c">trustless atomic swaps</text>
    <rect x="1000" y="318" width="170" height="64" rx="12" fill="#ffffff" stroke="#11131a" stroke-width="1.5"/>
    <text x="1085" y="357" text-anchor="middle" font-size="16" font-weight="700">Monero</text>
    <line x1="1000" y1="350" x2="952" y2="350" stroke="#ff6a13" stroke-width="2.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <text x="600" y="664" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#4a4f5c">DESIGN DRAFT, v0.x SPEC. NOT DEPLOYED, NOT AUDITED.</text>
  </g>
</svg>
